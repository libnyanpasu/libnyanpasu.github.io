name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: latest
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v6
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Format Check
        run: pnpm fmt:check
      - name: Type Check
        run: pnpm check
      - name: Test release selection
        run: pnpm test:release
      - name: Test download catalog and device selection
        run: pnpm test:download
      - name: Install Chromium for download page checks
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Test download page in Chromium
        run: pnpm test:download:browser
      - name: Test README badges
        run: pnpm test:badges
