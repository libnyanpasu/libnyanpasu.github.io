name: Deploy

on:
  # Runs on pushes targeting the `main` branch. Change this to `master` if you're
  # using the `master` branch as the default branch.
  push:
    branches: [main]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published tag to validate before selecting the newest complete release
        required: false
        type: string

  repository_dispatch:
    types: [clash-nyanpasu-release]

  schedule:
    - cron: "23 3 * * *"

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build job
  build:
    name: Build
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    outputs:
      capture-key: ${{ steps.capture-key.outputs.key }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Not needed if lastUpdated is not enabled
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: latest
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v6
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build with Astro
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.client_payload.tag || inputs.release_tag }}
        run: pnpm build
      # Everything the README captures can depend on, hashed after the build so the release data
      # it regenerates (src/data/*.generated.json) is included. Docs pages are left out: the
      # captures only record the home page. When this hash is unchanged, the capture jobs reuse
      # their cached recordings instead of recording and encoding them again.
      - name: Hash README capture inputs
        id: capture-key
        run: >-
          echo "key=${{ hashFiles(
          'src/**', '!src/content/docs/**', 'public/**', 'messages/**', 'project.inlang/settings.json',
          'astro.config.mjs', 'package.json', 'pnpm-lock.yaml',
          'scripts/capture-readme-cards.ts', 'scripts/readme-card-timing.ts', 'scripts/readme-card-video.ts',
          '.github/workflows/deploy.yml'
          ) }}" >> "$GITHUB_OUTPUT"
      - name: Upload site
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist
          retention-days: 1

  # WebP, WebM and AVIF home page demos for the client's README, at dist/readme/. Each demo
  # records in slow motion and takes minutes to encode, so every card and theme runs side by side,
  # one per job. Recordings are cached by the build's capture-key, so a deploy whose capture inputs
  # did not change (docs edits, scheduled rebuilds) restores them instead of recording again.
  capture:
    name: Capture ${{ matrix.card }} (${{ matrix.theme }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The targets and themes in scripts/capture-readme-cards.ts.
        card: [hero, material-window, traffic, profiles, dashboard, material, cores, logs]
        theme: [light, dark]
    env:
      # Kept apart from dist/readme, which also holds the build's badges.
      CAPTURE_DIR: readme-captures
    steps:
      - name: Restore cached captures
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CAPTURE_DIR }}
          key: readme-capture-${{ matrix.card }}-${{ matrix.theme }}-${{ needs.build.outputs.capture-key }}
      - name: Checkout
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
      - name: Setup Node
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: latest
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Get pnpm store directory
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v6
        if: steps.cache.outputs.cache-hit != 'true'
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
      - name: Install Chromium and media encoders
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          pnpm exec playwright install --with-deps --only-shell chromium
          sudo apt-get install -y --no-install-recommends webp ffmpeg
      - name: Check capture timing and output formats
        if: steps.cache.outputs.cache-hit != 'true'
        run: pnpm test:readme
      - name: Download site
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v8
        with:
          name: site
          path: dist
      - name: Capture
        if: steps.cache.outputs.cache-hit != 'true'
        run: >-
          pnpm readme:cards --cards ${{ matrix.card }} --themes ${{ matrix.theme }}
          --out ${{ env.CAPTURE_DIR }}
      - name: Save captures to cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CAPTURE_DIR }}
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Upload captures
        uses: actions/upload-artifact@v7
        with:
          name: readme-${{ matrix.card }}-${{ matrix.theme }}
          path: ${{ env.CAPTURE_DIR }}
          if-no-files-found: error
          retention-days: 1

  # The site and every capture, as the Pages artifact.
  assemble:
    name: Assemble
    needs: [build, capture]
    runs-on: ubuntu-latest
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Download site
        uses: actions/download-artifact@v8
        with:
          name: site
          path: dist
      - name: Download captures
        uses: actions/download-artifact@v8
        with:
          pattern: readme-*
          merge-multiple: true
          path: dist/readme
      - run: touch dist/.nojekyll
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: assemble
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
